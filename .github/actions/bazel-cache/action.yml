name: 'Configure Bazel Cache'
description: 'Set up GCS remote cache and optional disk cache for Bazel builds'

inputs:
  gcp_project_id:
    description: 'GCP project ID'
    required: true
  workload_identity_provider:
    description: 'Full workload identity provider resource name'
    required: true
  service_account:
    description: 'GCP service account email with read/write cache access. Only used for push/schedule on main.'
    required: true
  service_account_ro:
    description: 'GCP service account email with read-only cache access. Used for every other run.'
    required: true
  cache_bucket:
    description: 'GCS bucket name for remote cache'
    required: true
  cache_key:
    description: 'Cache key prefix for disk cache via actions/cache. Omit to skip disk cache.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # GCP IAM only lets the writer SA be impersonated by push/schedule runs on
    # main (WIF attribute.ref_event). Picking it anywhere else fails auth, so
    # this choice must match that binding rather than act as the control.
    - name: Select cache identity
      id: sa
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        SA_RW: ${{ inputs.service_account }}
        SA_RO: ${{ inputs.service_account_ro }}
      run: |
        if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ]; } && [ "$REF" = "refs/heads/main" ]; then
          SA="$SA_RW"; WRITER=true; KIND="read/write"
        else
          SA="$SA_RO"; WRITER=false; KIND="read-only"
        fi
        # Composite actions don't enforce `required`, and an empty SA makes the
        # auth step fail under continue-on-error, so the build would silently go cold.
        if [ -z "$SA" ]; then
          echo "::error::No $KIND cache service account configured (check GCP_SERVICE_ACCOUNT / GCP_SERVICE_ACCOUNT_RO repo variables)."
          exit 1
        fi
        echo "email=$SA" >> "$GITHUB_OUTPUT"
        echo "writer=$WRITER" >> "$GITHUB_OUTPUT"
        echo "Using $KIND cache identity: $SA"

    - name: Authenticate to Google Cloud
      id: auth
      continue-on-error: true
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ inputs.gcp_project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ steps.sa.outputs.email }}
        token_format: 'access_token'

    - name: Configure Bazel remote cache
      shell: bash
      env:
        AUTH_OUTCOME: ${{ steps.auth.outcome }}
        CACHE_BUCKET: ${{ inputs.cache_bucket }}
        CACHE_WRITER: ${{ steps.sa.outputs.writer }}
      run: |
        # Always write config=ci for non-remote flags (circuit breaker, etc.)
        echo "build --config=ci" >> .bazelrc.local

        # Write cache config to a job-specific file. Bootstrapped projects
        # (e.g. /tmp/valdi_app) import this via try-import in ~/.bazelrc,
        # avoiding races when concurrent jobs share a runner.
        CACHE_RC="/tmp/bazelrc-cache-${GITHUB_RUN_ID}-${GITHUB_JOB}"
        > "$CACHE_RC"
        echo "BAZEL_CACHE_RC=$CACHE_RC" >> "$GITHUB_ENV"

        if [ "$AUTH_OUTCOME" != "success" ]; then
          echo "Auth skipped (expected for fork PRs). Building without remote cache."
          exit 0
        fi

        # Bazel credential helper for the GCS remote cache. Invoked per
        # request (subject to its `expires` caching) so a single long-running
        # `bazel build` can rotate tokens mid-build instead of being stuck
        # with the bearer set at startup. Absolute path so the bootstrapped
        # project at /tmp/valdi_app can find it too.
        CRED_HELPER="$GITHUB_WORKSPACE/tools/ci/bazel_gcs_credential_helper.sh"

        # Checkout directory config
        echo "build --remote_cache=https://storage.googleapis.com/$CACHE_BUCKET" >> .bazelrc.local
        echo "build --credential_helper=storage.googleapis.com=$CRED_HELPER" >> .bazelrc.local
        # Default helper timeout (10s) can fire on the cold path when the
        # helper does the OIDC + STS + impersonation chain; give it 30s.
        echo "build --credential_helper_timeout=30s" >> .bazelrc.local
        # Transient GCS connection drops (broken pipe mid-bulk-transfer) can
        # exhaust the default 5 retries on a long build. Bump retries and
        # per-request timeout so one network blip doesn't kill a 2h+ job.
        echo "build --remote_retries=10" >> .bazelrc.local
        echo "build --remote_timeout=300s" >> .bazelrc.local
        # macOS runners hit ENOBUFS ("No buffer space available") mid-bulk-transfer
        # when Bazel opens its default 100 concurrent connections to the cache.
        # Retries don't help: the host is out of socket buffers, not blipping.
        echo "build --remote_max_connections=32" >> .bazelrc.local
        # Only the writer identity can upload; anything else would 403 on every write.
        if [ "$CACHE_WRITER" = "true" ]; then
          echo "build --remote_upload_local_results=true" >> .bazelrc.local
        else
          echo "build --remote_upload_local_results=false" >> .bazelrc.local
        fi

        # Point ~/.bazelrc to the job-specific file via try-import.
        # Single atomic write — no truncation window for concurrent jobs.
        echo "try-import $CACHE_RC" > ~/.bazelrc

        # Cache config for bootstrapped projects (discovered via try-import above)
        echo "build --remote_cache=https://storage.googleapis.com/$CACHE_BUCKET" >> "$CACHE_RC"
        echo "build --credential_helper=storage.googleapis.com=$CRED_HELPER" >> "$CACHE_RC"
        echo "build --credential_helper_timeout=30s" >> "$CACHE_RC"
        echo "build --remote_retries=10" >> "$CACHE_RC"
        echo "build --remote_timeout=300s" >> "$CACHE_RC"
        echo "build --remote_max_connections=32" >> "$CACHE_RC"
        echo "build --experimental_circuit_breaker_strategy=failure" >> "$CACHE_RC"
        if [ "$CACHE_WRITER" = "true" ]; then
          echo "build --remote_upload_local_results=true" >> "$CACHE_RC"
        else
          echo "build --remote_upload_local_results=false" >> "$CACHE_RC"
        fi

        # Sanity-check: the helper must actually mint a Bearer token now that
        # auth is set up. If it doesn't, fail fast with a readable error
        # instead of letting the build go anonymous and 403 on every fetch.
        HELPER_OUT="$("$CRED_HELPER" get <<< '{"uri":"https://storage.googleapis.com/"}')"
        if ! printf '%s' "$HELPER_OUT" | jq -e '(.headers.Authorization[0] // "") | startswith("Bearer ")' >/dev/null; then
          echo "::error::Bazel GCS credential helper did not return a Bearer token after auth succeeded."
          echo "Helper output: $HELPER_OUT"
          echo "Helper log (if any):"
          cat /tmp/bazel-cred-helper.log 2>/dev/null || true
          exit 1
        fi
        echo "Bazel GCS credential helper sanity check passed."

        # A minted token doesn't prove the identity can read the bucket (e.g. the
        # SA's bucket role lapsed). Without this, every cache read 403s and the
        # build silently runs cold.
        AUTH_HEADER="$(printf '%s' "$HELPER_OUT" | jq -r '.headers.Authorization[0]')"
        PROBE_CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: $AUTH_HEADER" \
          "https://storage.googleapis.com/storage/v1/b/$CACHE_BUCKET/o?maxResults=1")"
        if [ "$PROBE_CODE" != "200" ]; then
          echo "::error::Cache identity cannot list gs://$CACHE_BUCKET (HTTP $PROBE_CODE)."
          exit 1
        fi
        echo "Bazel cache bucket read check passed."

    - name: Prune and configure disk cache
      if: inputs.cache_key != ''
      shell: bash
      run: |
        # Prune old cache files to prevent unbounded growth on persistent runners
        find "$HOME/.cache/bazel/disk" -type f -atime +7 -delete 2>/dev/null || true
        find "$HOME/.cache/bazel/repo" -type f -atime +7 -delete 2>/dev/null || true

        echo "build:ci --disk_cache=$HOME/.cache/bazel/disk" >> .bazelrc.local
        echo "build:ci --repository_cache=$HOME/.cache/bazel/repo" >> .bazelrc.local
        if [ -n "$BAZEL_CACHE_RC" ]; then
          echo "build --disk_cache=$HOME/.cache/bazel/disk" >> "$BAZEL_CACHE_RC"
          echo "build --repository_cache=$HOME/.cache/bazel/repo" >> "$BAZEL_CACHE_RC"
        fi

    - name: Mount Bazel cache
      if: inputs.cache_key != '' && runner.environment == 'github-hosted'
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cache/bazel/disk
          ~/.cache/bazel/repo
          ~/.cache/bazelisk
        key: bazel-${{ runner.os }}-${{ inputs.cache_key }}-${{ hashFiles('MODULE.bazel', '**/*.bzl') }}-${{ github.run_id }}
        restore-keys: |
          bazel-${{ runner.os }}-${{ inputs.cache_key }}-${{ hashFiles('MODULE.bazel', '**/*.bzl') }}-
          bazel-${{ runner.os }}-${{ inputs.cache_key }}-
