name: Android Instrumentation Tests

# Runs on pushes to main, nightly, and on same-repo pull requests that touch the Android
# runtime, the view classes or the test support. The job needs an x86_64 Valdi build (~25 GB of
# output base) plus an emulator. A cold build takes 40+ minutes, but pull request runs read the
# Bazel remote cache the nightly writes (the bazel-cache action gives them the read-only
# identity), so they build mostly from cache. The nightly takes 20 to 27 minutes. Fork pull
# requests get no remote cache and would build cold, so the job skips them; run it by hand
# on a fork branch with the manual trigger instead. The pull_request and push paths match:
# they cover what changes a view's class hierarchy or the test runtime, not every native
# dependency.
#
# Use the manual trigger to exercise this on a branch before merging.
on:
  pull_request:
    paths:
      - 'apps/helloworld/**'
      - 'valdi/src/java/**'
      - 'valdi/src/android_support/**'
      - 'valdi/src/android_test_support/**'
      - 'valdi/src/android_test_runtime/**'
      - 'valdi/BUILD.bazel'
      - 'MODULE.bazel'
      - 'tools/ci/android_instrumentation_tests.sh'
      - 'tools/ci/setup_linux_env.sh'
      - '.github/workflows/android-instrumentation-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/helloworld/**'
      - 'valdi/src/java/**'
      - 'valdi/src/android_support/**'
      - 'valdi/src/android_test_support/**'
      - 'valdi/src/android_test_runtime/**'
      - 'valdi/BUILD.bazel'
      - 'MODULE.bazel'
      - 'tools/ci/android_instrumentation_tests.sh'
      - 'tools/ci/setup_linux_env.sh'
      - '.github/workflows/android-instrumentation-tests.yml'
      - '.bazelrc'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'src/BUILD.bazel'
      - 'android_mvn_install.json'
      - 'maven_install.json'
      - 'rules_android_maven_install.json'
      - 'test_mvn_install.json'
      - 'valdi/valdi.bzl'
      - 'valdi/src/android_support/**'
      - 'valdi/src/bindings/**'
      - 'valdi/src/java_plugin/**'
      - 'valdi/res/**'
      - 'valdi/generated-src/**'
      - 'valdi_core/BUILD.bazel'
      - 'valdi_core/djinni_compat.bzl'
      - 'valdi_core/generated-src/**'
      - 'valdi_protobuf/**'
      - 'libs/utils/**'
      - 'tsn/**'
      - 'modules/**'
      - 'src/platform-projects/**'
      - 'tools/zstd/**'
      - 'third-party/djinni-support-lib/**'
      - 'third-party/hermes/**'
      - 'third-party/quickjs/**'
      - 'third-party/yoga/**'
      - 'src/valdi_modules/src/valdi/coreutils/**'
      - 'src/valdi_modules/src/valdi/file_system/**'
      - 'src/valdi_modules/src/valdi/jasmine/**'
      - 'src/valdi_modules/src/valdi/source_map/**'
      - 'src/valdi_modules/src/valdi/valdi_standalone/**'
      - 'src/valdi_modules/src/valdi/valdi_tsx/**'
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC, ~2am PT
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI to build and test'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64-v8a

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-instrumentation-tests:
    name: Android Instrumentation Tests
    # Fork pull requests have no remote cache, so the build would be cold. See the header.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # x86_64, not arm64: GitHub's arm64 Linux runners do not expose /dev/kvm, so an
    # emulator there would have no hardware acceleration.
    # Pinned, not ubuntu-latest: 26.04 lacks libxml2.so.2, which the LLVM 19 ld.lld needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Bazel cache
        uses: ./.github/actions/bazel-cache
        with:
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          service_account_ro: ${{ vars.GCP_SERVICE_ACCOUNT_RO }}
          cache_bucket: ${{ vars.BAZEL_CACHE_BUCKET }}
          cache_key: android-instrumentation-tests
          # The remote cache already serves outputs. A multi-GB disk cache entry pushes this job's
          # repository cache (the Maven jars) out of the repo's 10 GB Actions cache limit, and a
          # cold run then hits Maven Central's 429s.
          disk_cache: 'false'

      - name: Restore CI download cache
        uses: ./.github/actions/download-cache

      # Also does the disk reclaiming. A cold build needs ~25 GB and the runner starts
      # with ~26 GB free, so this is not optional here.
      - name: Setup Linux environment
        run: source ./tools/ci/setup_linux_env.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The build and the emulator do not fit on the same runner: a cold build takes the
      # ~26GB the reclaim above frees up, and the emulator then needs another ~7.4GB for its
      # userdata partition. The script drops the Bazel output base in between.
      - name: Run instrumented tests on an emulator
        run: ./tools/ci/android_instrumentation_tests.sh
        env:
          VALDI_ANDROID_ABI: ${{ inputs.abi || 'x86_64' }}
          VALDI_START_EMULATOR: '1'
          VALDI_RECLAIM_BUILD_SPACE: '1'

      - name: Report disk usage
        if: always()
        run: df -h /

      - name: Upload logcat
        if: failure()
        run: adb logcat -d > /tmp/logcat.txt || true

      - name: Upload logcat artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-logcat
          path: /tmp/logcat.txt
          retention-days: 5
