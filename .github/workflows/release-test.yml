# Release test: bootstrap an app using the CLI's default pinned versions,
# build and test. Validates the exact user experience of `valdi bootstrap`.
name: Release Test (Public GitHub)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - 'beta-*'
      - '[0-9]*'
  pull_request:
    paths:
      - 'npm_modules/cli/src/commands/bootstrap.ts'
      - 'npm_modules/cli/src/utils/githubUtils.ts'
      - 'tools/ci/release_test.sh'
      - '.github/workflows/release-test.yml'
      - 'npm_modules/cli/src/index.ts'
      - 'npm_modules/cli/src/commands/projectsync.ts'
      - 'npm_modules/cli/src/core/constants.ts'
      - 'npm_modules/cli/src/core/errors.ts'
      - 'npm_modules/cli/src/utils/ArgumentsResolver.ts'
      - 'npm_modules/cli/src/utils/BazelClient.ts'
      - 'npm_modules/cli/src/utils/Digraph.ts'
      - 'npm_modules/cli/src/utils/LoadingIndicator.ts'
      - 'npm_modules/cli/src/utils/byString.ts'
      - 'npm_modules/cli/src/utils/cliUtils.ts'
      - 'npm_modules/cli/src/utils/copyBootstrapFiles.ts'
      - 'npm_modules/cli/src/utils/errorUtils.ts'
      - 'npm_modules/cli/src/utils/fileUtils.ts'
      - 'npm_modules/cli/src/utils/jsonUtils.ts'
      - 'npm_modules/cli/src/utils/logUtils.ts'
      - 'npm_modules/cli/src/utils/pathUtils.ts'
      - 'npm_modules/cli/src/utils/stringUtils.ts'
      - 'npm_modules/cli/package.json'
      - 'npm_modules/cli/package-lock.json'
      - 'npm_modules/cli/tsconfig.json'
      - 'npm_modules/cli/tsconfig.dist.json'
      - 'npm_modules/cli/scripts/**'
      - 'npm_modules/cli/.bootstrap/apps/ui_application/**'
      - 'npm_modules/cli/.metadata/**'
  # Pins and downloads can rot between releases; this is the only run of the
  # published-pin bootstrap outside a release.
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-test:
    name: Bootstrap with default pinned versions, build & test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.5.0'
          # macOS 27: its dyld rejects Rust proc-macros stripped by rustc < 1.98
          # (rust-lang/rust#157750), which macOS 26 runners can't catch.
          - runner: xcode-27
            xcode: '27.0.0'
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pin Xcode
        uses: ./.github/actions/pin-xcode
        with:
          version: ${{ matrix.xcode }}

      - name: Configure Bazel cache
        uses: ./.github/actions/bazel-cache
        with:
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          service_account_ro: ${{ vars.GCP_SERVICE_ACCOUNT_RO }}
          cache_bucket: ${{ vars.BAZEL_CACHE_BUCKET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bazel and watchman
        run: |
          brew install bazelisk watchman
          bazel --version
          watchman --version

      - name: Run release test
        run: ./tools/ci/release_test.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-failure-${{ matrix.runner }}
          path: |
            /tmp/valdi_release_test/MODULE.bazel
            /tmp/valdi_release_test/WORKSPACE
            /tmp/valdi_release_test/.bazelrc
            /tmp/valdi_release_test/BUILD.bazel
          retention-days: 7
