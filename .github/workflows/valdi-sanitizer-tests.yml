name: Valdi Sanitizer Tests

# Deliberately not run on pull requests. AddressSanitizer is a full instrumented build that the
# Bazel remote cache does not populate for PRs (the bazel-cache action only uploads on push,
# schedule and workflow_dispatch), so every PR would pay the multi-minute cold build. Running on
# main plus nightly still catches teardown / threading memory-safety regressions, and PRs keep the
# cheap build gate that internal CI runs via client_validate_valdi_open_source.sh.
#
# Use the manual trigger to exercise this on a branch before merging.
on:
  push:
    branches:
      - main
    paths:
      - '.bazelrc'
      - '.github/workflows/valdi-sanitizer-tests.yml'
      - 'tools/ci/sanitizer_tests.sh'
      - 'tools/ci/setup_linux_env.sh'
      - 'valdi/BUILD.bazel'
      - 'valdi/src/**'
      - 'valdi/test/integration/**'
      - 'valdi_core/src/**'
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC, ~3am PT (offset from the other nightly jobs)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valdi-sanitizer-tests:
    name: Valdi ASan Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Bazel cache
        uses: ./.github/actions/bazel-cache
        with:
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          cache_bucket: ${{ vars.BAZEL_CACHE_BUCKET }}
          cache_key: valdi-sanitizer-tests

      # Creates the `bzl` wrapper and reclaims disk (ASan output base is large).
      - name: Setup Linux environment
        run: source ./tools/ci/setup_linux_env.sh

      - name: Run integration tests under AddressSanitizer
        run: ./tools/ci/sanitizer_tests.sh

      - name: Report disk usage
        if: always()
        run: df -h /
