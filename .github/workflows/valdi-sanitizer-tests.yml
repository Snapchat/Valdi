name: Valdi Sanitizer Tests

# Runs Valdi's C++ integration, runtime, snap_drawing and fuzzer-corpus tests under AddressSanitizer.
#
# Pull requests run this only when they touch what the ASan targets build from (the runtime,
# snap_drawing, the fuzzer, valdi/test/**, the ASan toolchain config), so unrelated changes skip
# the instrumented build. PR runs read the Bazel remote cache that main and nightly populate (the
# bazel-cache action never uploads from a PR), so a same-repo PR pays roughly a warm-cache run.
# Fork PRs get no GCP credentials from GitHub; they build without the remote cache but can still
# restore the actions/cache disk cache saved from main.
#
# Use the manual trigger to exercise this on a branch before merging.
on:
  pull_request:
    paths:
      - '.bazelrc'
      - '.github/workflows/valdi-sanitizer-tests.yml'
      - 'tools/ci/sanitizer_tests.sh'
      - 'tools/ci/setup_linux_env.sh'
      - 'valdi/BUILD.bazel'
      - 'valdi/src/**'
      - 'valdi/fuzz/**'
      - 'valdi/test/**'
      - 'snap_drawing/**'
      - 'valdi_core/src/**'
  push:
    branches:
      - main
    paths:
      - '.bazelrc'
      - '.github/workflows/valdi-sanitizer-tests.yml'
      - 'tools/ci/sanitizer_tests.sh'
      - 'tools/ci/setup_linux_env.sh'
      - 'valdi/BUILD.bazel'
      - 'valdi/src/**'
      - 'valdi/fuzz/**'
      - 'valdi/test/integration/**'
      - 'valdi/test/runtime/**'
      - 'valdi/test/snap_drawing/**'
      - 'snap_drawing/**'
      - 'valdi_core/src/**'
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC, ~3am PT (offset from the other nightly jobs)
  workflow_dispatch:

# id-token: write is only for the bazel-cache action's GCP Workload Identity auth. PRs get the
# read-only cache account; GitHub withholds OIDC tokens from fork PRs, and the action then builds
# without the remote cache. Never switch this to pull_request_target: PR code must not run with
# the base repo's credentials.
permissions:
  contents: read
  id-token: write

# github.ref is refs/pull/<n>/merge for PRs, so a new push to a PR cancels that PR's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valdi-sanitizer-tests:
    name: Valdi ASan Integration Tests
    # Pinned, not ubuntu-latest: 26.04 lacks libxml2.so.2, which the LLVM 19 ld.lld needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Bazel cache
        uses: ./.github/actions/bazel-cache
        with:
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          service_account_ro: ${{ vars.GCP_SERVICE_ACCOUNT_RO }}
          cache_bucket: ${{ vars.BAZEL_CACHE_BUCKET }}
          cache_key: valdi-sanitizer-tests

      # Creates the `bzl` wrapper and reclaims disk (ASan output base is large).
      - name: Setup Linux environment
        run: source ./tools/ci/setup_linux_env.sh

      - name: Run integration tests under AddressSanitizer
        run: ./tools/ci/sanitizer_tests.sh

      - name: Report disk usage
        if: always()
        run: df -h /
