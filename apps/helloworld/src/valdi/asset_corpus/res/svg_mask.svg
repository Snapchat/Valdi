<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="luminance" x="0" y="0" width="48" height="48" maskUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="url(#fade)"/>
      <circle cx="24" cy="24" r="6" fill="#000"/>
    </mask>
    <mask id="alpha" mask-type="alpha" maskContentUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5" fill="#000" fill-opacity="0.5"/>
    </mask>
  </defs>
  <rect width="48" height="48" fill="#264653" mask="url(#luminance)"/>
  <rect x="24" y="24" width="24" height="24" fill="#e9c46a" mask="url(#alpha)"/>
</svg>
