<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="lin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.5" stop-color="#ffc371" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2193b0"/>
    </linearGradient>
    <linearGradient id="linUser" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="12" y2="24" spreadMethod="reflect">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="rad" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3" gradientTransform="rotate(30 0.5 0.5)">
      <stop offset="0" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#6a3093;stop-opacity:0.2"/>
    </radialGradient>
    <linearGradient id="inherited" xlink:href="#lin" x1="1" x2="0"/>
